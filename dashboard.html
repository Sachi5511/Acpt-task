<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="form">
        <h2>Dashboard</h2>
        <input type="text" id="name" placeholder="Enter username">
        <input type="number" id="age" placeholder="Enter age">
        <input type="text" id="contact" placeholder="User contact">
        <input type="text" id="town" placeholder="Town">
        <button type="button" class="btn" onclick="Save()">Save Data</button>
    </div>

    <div class="table">
        <h2>Saved Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Age</th>
                    <th>Contact</th>
                    <th>Town</th>
                </tr>
            </thead>
            <tbody id="displayTable">
                </tbody>
        </table>
    </div>

    <script src="./dashboard.js"></script>
</body>
</html>
